services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_ops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio_ops
      POSTGRES_PASSWORD: portfolio_ops_dev
      POSTGRES_DB: portfolio_ops
    ports:
      # 5440/5441, not 5432-5434: this machine already runs a Postgres on those.
      - "5440:5432"
    volumes:
      - portfolio_ops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_ops -d portfolio_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate database used only by integration tests, so a test run can never
  # touch development data (spec §66: never test payroll against live data).
  postgres_test:
    image: postgres:16-alpine
    container_name: portfolio_ops_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio_ops
      POSTGRES_PASSWORD: portfolio_ops_dev
      POSTGRES_DB: portfolio_ops_test
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_ops -d portfolio_ops_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio_ops_pgdata:
